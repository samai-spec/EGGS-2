name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        working-directory: arish-eggs
        run: npm install

      - name: 4. Build Web Application
        working-directory: arish-eggs
        run: npm run build

      - name: 5. Setup Capacitor Android Project
        working-directory: arish-eggs
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ARISH EGGS" "com.arisheggs.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: 6. Replace Capacitor Icons with Your Original Logo Safely
        working-directory: arish-eggs
        run: |
          # العثور على شعارك الأصلي
          LOGO="public/logo.png"
          if [ ! -f "$LOGO" ]; then
            LOGO="public/icon.png"
          fi
          echo "Using logo from: $LOGO"

          RES_DIR="android/app/src/main/res"

          # 1. حذف مجلد anydpi-v26 الذي يحتوي على رمز المكثف الأزرق المائل لمنع تكرار الملفات
          rm -rf "$RES_DIR/mipmap-anydpi-v26"

          # 2. استبدال الأيقونات بصورتك الأصلية في كافة مجلدات الأندرويد
          for dir in "$RES_DIR"/mipmap-*; do
            if [ -d "$dir" ]; then
              echo "Replacing icons in: $dir"
              cp -f "$LOGO" "$dir/ic_launcher.png"
              cp -f "$LOGO" "$dir/ic_launcher_round.png"
              cp -f "$LOGO" "$dir/ic_launcher_foreground.png"
            fi
          done

          # 3. استبدال شاشات البداية بشعارك الأصلي أيضاً
          for dir in "$RES_DIR"/drawable*; do
            if [ -d "$dir" ]; then
              if [ -f "$dir/splash.png" ]; then
                cp -f "$LOGO" "$dir/splash.png"
              fi
            fi
          done

      - name: 7. Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 8. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 9. Build Final Debug APK
        working-directory: arish-eggs/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 10. Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARISH-EGGS-APK
          path: arish-eggs/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
