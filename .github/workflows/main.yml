name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        working-directory: arish-eggs
        run: npm install

      - name: 4. Build Web Application
        working-directory: arish-eggs
        run: npm run build

      - name: 5. Setup Capacitor Android Project
        working-directory: arish-eggs
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "ARISH EGGS" "com.arisheggs.app" --web-dir dist
          npx cap add android
          npx cap sync android

      - name: 6. Resize and Apply Original Logo into Android Adaptive & Standard Icons
        working-directory: arish-eggs
        run: |
          # تثبيت أداة معالجة الصور السريعة
          npm install -g sharp-cli

          LOGO="public/logo.png"
          if [ ! -f "$LOGO" ]; then
            LOGO="public/icon.png"
          fi
          echo "Using logo from: $LOGO"

          RES="android/app/src/main/res"

          # 1. توليد الأيقونات العادية والدائرية بالمقاسات الرسمية لأندرويد
          sharp -i "$LOGO" -o "$RES/mipmap-mdpi/ic_launcher.png" resize 48 48
          sharp -i "$LOGO" -o "$RES/mipmap-mdpi/ic_launcher_round.png" resize 48 48
          sharp -i "$LOGO" -o "$RES/mipmap-mdpi/ic_launcher_foreground.png" resize 108 108

          sharp -i "$LOGO" -o "$RES/mipmap-hdpi/ic_launcher.png" resize 72 72
          sharp -i "$LOGO" -o "$RES/mipmap-hdpi/ic_launcher_round.png" resize 72 72
          sharp -i "$LOGO" -o "$RES/mipmap-hdpi/ic_launcher_foreground.png" resize 162 162

          sharp -i "$LOGO" -o "$RES/mipmap-xhdpi/ic_launcher.png" resize 96 96
          sharp -i "$LOGO" -o "$RES/mipmap-xhdpi/ic_launcher_round.png" resize 96 96
          sharp -i "$LOGO" -o "$RES/mipmap-xhdpi/ic_launcher_foreground.png" resize 216 216

          sharp -i "$LOGO" -o "$RES/mipmap-xxhdpi/ic_launcher.png" resize 144 144
          sharp -i "$LOGO" -o "$RES/mipmap-xxhdpi/ic_launcher_round.png" resize 144 144
          sharp -i "$LOGO" -o "$RES/mipmap-xxhdpi/ic_launcher_foreground.png" resize 324 324

          sharp -i "$LOGO" -o "$RES/mipmap-xxxhdpi/ic_launcher.png" resize 192 192
          sharp -i "$LOGO" -o "$RES/mipmap-xxxhdpi/ic_launcher_round.png" resize 192 192
          sharp -i "$LOGO" -o "$RES/mipmap-xxxhdpi/ic_launcher_foreground.png" resize 432 432

          # 2. توليد شاشة البداية بحجم مناسب وخفيف
          for dir in "$RES"/drawable*; do
            if [ -d "$dir" ] && [ -f "$dir/splash.png" ]; then
              sharp -i "$LOGO" -o "$dir/splash.png" resize 480 480 --fit contain
            fi
          done

      - name: 7. Setup Java 21 JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 8. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 9. Build Final Debug APK
        working-directory: arish-eggs/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: 10. Upload Final APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ARISH-EGGS-APK
          path: arish-eggs/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
